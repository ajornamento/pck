<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-label="비둘기와 올리브 가지, 여러 언어로 쓰인 평화라는 글자">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <g font-family="'Noto Sans KR', 'Noto Sans', Arial, sans-serif" font-weight="700">
    <text x="250" y="72" font-size="44" fill="#93C5FD" fill-opacity="0.55" text-anchor="middle" transform="rotate(-8 250 72)">εἰρήνη</text>
    <text x="820" y="68" font-size="56" fill="#60A5FA" fill-opacity="0.55" text-anchor="middle" direction="rtl" transform="rotate(-3 820 68)">سلام</text>
    <text x="1360" y="80" font-size="50" fill="#86EFAC" fill-opacity="0.55" text-anchor="middle" transform="rotate(9 1360 80)">paz</text>

    <text x="1130" y="190" font-size="125" fill="#86EFAC" fill-opacity="0.55" text-anchor="middle" transform="rotate(-5 1130 190)">평화</text>
    <text x="1010" y="290" font-size="100" fill="#93C5FD" fill-opacity="0.45" text-anchor="middle" transform="rotate(4 1010 290)">平和</text>
    <text x="1160" y="350" font-size="62" letter-spacing="6" fill="#BBF7D0" fill-opacity="0.6" text-anchor="middle" transform="rotate(-3 1160 350)">PEACE</text>

    <text x="190" y="375" font-size="42" fill="#93C5FD" fill-opacity="0.55" text-anchor="middle" transform="rotate(6 190 375)">paix</text>
    <text x="1300" y="380" font-size="38" fill="#BBF7D0" fill-opacity="0.55" text-anchor="middle" transform="rotate(-5 1300 380)">Frieden</text>
  </g>

  <g transform="translate(330,230) scale(0.65)">
    <!-- body: chest-belly-tail curve -->
    <path d="M -125,85
             Q -60,100 -20,75
             Q 40,50 90,10
             Q 115,-5 120,-25
             Q 60,-15 0,-15
             Q -60,-10 -100,20
             Q -120,40 -125,85 Z"
          fill="#7EB6EE" stroke="#2E5FA3" stroke-width="4" stroke-linejoin="round"/>

    <!-- tail feathers -->
    <path d="M -125,85 L -175,70 L -150,105 Z" fill="#7EB6EE" stroke="#2E5FA3" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -125,85 L -160,120 L -130,120 Z" fill="#7EB6EE" stroke="#2E5FA3" stroke-width="2" stroke-linejoin="round"/>

    <!-- wing: single rotated ellipse swept up-left from the shoulder -->
    <ellipse cx="-50" cy="-90" rx="130" ry="42" fill="#7EB6EE" stroke="#2E5FA3" stroke-width="4" transform="rotate(33 -50 -90)"/>

    <!-- head -->
    <circle cx="125" cy="-35" r="38" fill="#7EB6EE" stroke="#2E5FA3" stroke-width="4"/>

    <!-- beak -->
    <path d="M 155,-45 L 200,-35 L 155,-25 Z" fill="#F5A623"/>

    <!-- eye -->
    <circle cx="140" cy="-48" r="5" fill="#0F172A"/>

    <!-- olive branch -->
    <g transform="translate(200,-32) rotate(15)">
      <path d="M0,0 C 40,10 80,20 120,10" stroke="#15803D" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="20" cy="2" rx="14" ry="6" fill="#22C55E" transform="rotate(-20 20 2)"/>
      <ellipse cx="45" cy="8" rx="14" ry="6" fill="#16A34A" transform="rotate(15 45 8)"/>
      <ellipse cx="70" cy="6" rx="14" ry="6" fill="#22C55E" transform="rotate(-15 70 6)"/>
      <ellipse cx="95" cy="10" rx="14" ry="6" fill="#16A34A" transform="rotate(20 95 10)"/>
    </g>
  </g>
</svg>
